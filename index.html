<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/index.css">
    <title>Tareas - Inicio</title>
</head>

<body>

    <main class="form-container">
        <section class="card-form">
            <h2>Crear Nueva Tarea</h2>
            <p class="subtitle">Complete los campos para registrar una nueva actividad en el planificador.</p>

            <form id="form">

                <div class="form-group">
                    <label for="">Nombre de la Tarea <span class="required">*</span></label>
                    <input type="text" id="" name="" required placeholder="Ej. Diseñar la interfaz de inicio">
                </div>


                <div class="form-group">
                    <label for="">Descripción</label>
                    <textarea id="" name="" rows="3" placeholder="Detalles o pasos a seguir..."></textarea>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="">Asignado A <span class="required">*</span></label>
                        <input type="text" id="" name="" required placeholder="Nombre del responsable">
                    </div>


                    <div class="form-group">
                        <label for="">Fecha de Entrega <span class="required">*</span></label>
                        <input type="date" id="" name="" required>
                    </div>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="">Estado <span class="required">*</span></label>
                        <select id="" name="">
                            <option value="todo">Por hacer</option>
                            <option value="in-progress">En progreso</option>
                            <option value="done">Hecho</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="">Prioridad</label>
                        <select id="" name="">
                            <option value="low">Baja</option>
                            <option value="medium" selected>Media</option>
                            <option value="high">Alta</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-link">Archivo adjunto o Enlace</label>
                    <input type="url" id="task-url" name="taskUrl" required placeholder="Link / Enlace de referencia">
                </div>


                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar Tarea</button>
                </div>
            </form>
        </section>
    </main>

    <script src="/js/index.js"></script>
</body>

</html>
