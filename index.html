<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/tarjeta.css">
    <title>Tareas - Inicio</title>
</head>

<body>
    <div class="container">
        <main class="form-container">
            <section class="card-form">
                <h2>Crear Nueva Tarea</h2>
                <p class="subtitle">Complete los campos para registrar una nueva actividad en el planificador.</p>

                <form id="task-form" novalidate>

                    <div class="form-group">
                        <label for="task-name">Nombre de la Tarea <span class="required">*</span></label>
                        <input type="text" id="task-name" name="taskName" required
                            placeholder="Ej. Diseñar la interfaz de inicio">
                    </div>


                    <div class="form-group">
                        <label for="task-desc">Descripción <span class="required">*</span></label>
                        <textarea id="task-desc" name="taskDesc" rows="3" required
                            placeholder="Detalles o pasos a seguir..."></textarea>
                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="task-assigned">Asignado A <span class="required">*</span></label>
                            <input type="text" id="task-assigned" name="taskAssigned" required
                                placeholder="Nombre del responsable">
                        </div>


                        <div class="form-group">
                            <label for="task-date">Fecha de Entrega <span class="required">*</span></label>
                            <input type="date" id="task-date" name="taskDate" required>
                        </div>
                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="task-status">Estado <span class="required">*</span></label>
                            <select id="task-status" name="taskStatus">
                                <option value="">Seleccione Estado</option>
                                <option value="POR HACER">Por hacer</option>
                                <option value="EN PROCESO">En progreso</option>
                                <option value="REVISIÓN">Revisión</option>
                                <option value="HECHO">Hecho</option>
                            </select>
                        </div>


                        <div class="form-group">
                            <label for="task-priority">Prioridad</label>
                            <select id="task-priority" name="taskPriority">
                                <option value="low">Baja</option>
                                <option value="medium" selected>Media</option>
                                <option value="high">Alta</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="task-url">Archivo adjunto o Enlace</label>
                        <input type="url" id="task-url" name="taskUrl" placeholder="Link / Enlace de referencia">
                    </div>

                    <div id="form-errors" class="form-errors" role="alert" hidden></div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar Tarea</button>
                    </div>
                </form>
            </section>


        </main>
        <section id="task-list" class="task-list">
            <div class="card-header-info">
                <h3 class="task-title">Desarrollar la funcionalidad de guardar Tarea</h3>
                <span class="badge-priority high">Alta</span>
            </div>

            <!-- Descripción -->
            <p class="task-description">
                ckjsdjkdfbjsbjbdjfbdsfjsdbfdsjf
            </p>

            <!-- Metadatos (Asignado y Fecha) -->
            <div class="task-meta">
                <div class="meta-item">
                    <span class="meta-icon">👤</span>
                    <span class="meta-text">Yesid Hernandez</span>
                </div>
                <div class="meta-item">
                    <span class="meta-icon">📅</span>
                    <span class="meta-text">2026-10-30</span>
                </div>
            </div>

            <!-- Enlace adjunto (Opcional, se puede ocultar si no hay link) -->
            <div class="task-link-container">
                <a href="#" target="_blank" class="task-link">🔗 Ver enlace adjunto</a>
            </div>

            <!-- Pie de tarjeta: Estado y Botones de Acción -->
            <div class="card-footer-info">
                <span class="badge-status todo">Por hacer</span>

                <div class="card-actions">
                    <button class="btn-action btn-delete" title="Eliminar tarea">Eliminar</button>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="../js/script.js"></script>
</body>

</html>
